# ==============================================================
# ShopEase Spring Boot 3 & MongoDB Atlas Configuration
# ==============================================================

server.port=8080
spring.application.name=shopease-backend

# MongoDB Atlas Connection URI
# Replace with your Atlas connection string or local MongoDB instance:
# e.g., mongodb+srv://<username>:<password>@cluster0.mongodb.net/shopeasedb?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shopeasedb}
spring.data.mongodb.auto-index-creation=true

# JWT Token Secret (Min 256-bit key for HMAC-SHA256)
jwt.secret=${JWT_SECRET:ShopEaseSuperSecureJwtSecretKeyMustBeAtLeast256BitsLong2026!}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# Secure Admin Account Initialization Secret Key
# Required during registration to assign the ADMIN role securely
app.admin.init.secret=${ADMIN_INIT_SECRET:SHOPEASE_SUPER_ADMIN_2026}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.shopease=DEBUG
